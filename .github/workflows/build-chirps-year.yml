name: Build CHIRPS year(s)

# Two trigger paths:
#   1. Manual: run on demand with custom inputs (single year or
#      range of years, with skip-existing knob).
#   2. Scheduled: monthly refresh of the current year only, so
#      newly-published CHIRPS days flow into the mirror without
#      manual intervention.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Single year or range"
        required: true
        type: choice
        default: "single"
        options:
          - single
          - range
      year:
        description: "Single mode: which year (e.g. 2015)"
        required: false
        default: "2026"
      year_start:
        description: "Range mode: first year"
        required: false
        default: "1981"
      year_end:
        description: "Range mode: last year (inclusive)"
        required: false
        default: "2026"
      skip_existing:
        description: "Skip years already on Hugging Face"
        required: false
        type: boolean
        default: true

  schedule:
    # 15th of every month at 12:00 UTC.
    # CHIRPS finals publish with ~45-day lag from real time; running
    # mid-month catches the most recent month that has been published.
    - cron: "0 12 15 * *"

jobs:
  build:
    runs-on: ubuntu-latest

    # 6-hour cap. ~45 years × 4-5 min/year = comfortably under.
    # Scheduled runs only do current year, so much faster.
    timeout-minutes: 350

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build year(s)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Manual runs read from `inputs`; scheduled runs use
          # the current year via SCHEDULED_REFRESH=true.
          # The script handles each branch internally.
          MODE:              ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          YEAR:              ${{ inputs.year }}
          YEAR_START:        ${{ inputs.year_start }}
          YEAR_END:          ${{ inputs.year_end }}
          SKIP_EXISTING:     ${{ inputs.skip_existing }}
          SCHEDULED_REFRESH: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          python scripts/build_chirps_year.py
