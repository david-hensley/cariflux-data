name: Build CHIRPS year(s)

# Manual trigger only for now. Once we've finalized the
# bootstrap, we'll add a scheduled cron for monthly refreshes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Single year or range"
        required: true
        type: choice
        default: "single"
        options:
          - single
          - range
      year:
        description: "Single mode: which year (e.g. 2015)"
        required: false
        default: "2015"
      year_start:
        description: "Range mode: first year"
        required: false
        default: "1981"
      year_end:
        description: "Range mode: last year (inclusive)"
        required: false
        default: "2026"
      skip_existing:
        description: "Skip years already on Hugging Face"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    # 6-hour cap. ~45 years × 4-5 min/year = comfortably under.
    timeout-minutes: 350

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build year(s)
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          YEAR:          ${{ inputs.mode == 'single' && inputs.year       || '' }}
          YEAR_START:    ${{ inputs.mode == 'range'  && inputs.year_start || '' }}
          YEAR_END:      ${{ inputs.mode == 'range'  && inputs.year_end   || '' }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          python scripts/build_chirps_year.py
